name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name=chapterone .
      - name: Bump Kotlin Gradle plugin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.20"/' android/settings.gradle
          echo "--- android/settings.gradle after patch ---"
          cat android/settings.gradle
      - run: flutter pub get
      - name: Patch outdated proguard call in flutter_inappwebview_android
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name "flutter_inappwebview_android-*" | while read -r dir; do
            if [ -f "$dir/android/build.gradle" ]; then
              sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$dir/android/build.gradle"
              echo "Patched: $dir/android/build.gradle"
            fi
          done
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chapterone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
