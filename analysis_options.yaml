include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These are informational notices about newer Flutter APIs (e.g. Color
    # component accessors, ReorderableListView's onReorderItem) that don't
    # affect functionality. Silencing them keeps CI green without requiring
    # every dependency/SDK bump to be followed by an immediate rewrite.
    deprecated_member_use: ignore
