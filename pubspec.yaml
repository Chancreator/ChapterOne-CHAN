name: chapterone
description: ChapterOne — a customizable offline bookshelf app for EPUB/PDF ebooks and ecomics on Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_epub_viewer: ^1.0.9
  syncfusion_flutter_pdfviewer: any
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/chapterone_icon.png"

flutter:
  uses-material-design: true

dependency_overrides:
  flutter_inappwebview: any
  flutter_inappwebview_android: any
